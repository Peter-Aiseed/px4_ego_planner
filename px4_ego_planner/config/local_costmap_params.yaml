# Inside px4_ego_planner/config/local_costmap_params.yaml
costmap:
  global_frame: odom_drone_z
  robot_base_frame: base_link_stable    # Drone's center frame
  
  update_frequency: 30.0                # Refresh map 30 times a second
  publish_frequency: 20.0
  rolling_window: true                  # Keeps the map centered on the moving drone
  static_map: false                     # No static map, only dynamic obstacles
  
  width: 30.0                           # Map boundaries (30m x 30m)
  height: 30.0
  resolution: 0.1                       # Grid accuracy (10cm cells)

  # Define the layer pipeline
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  

  obstacle_layer:
    enabled: true
    obstacle_range: 14.5
    raytrace_range: 14.6

    observation_sources: rs_source tof_left tof_right tof_back

    rs_source:
      topic: /pointcloud/realsense/laserscan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 9.8
      inf_is_valid: true

    tof_back:
      topic: /tof_sensor_back/pointcloud
      data_type: PointCloud2
      marking: true
      clearing: false
      obstacle_range: 14.8
      raytrace_range: 15.0
      min_obstacle_height: -1.0
      max_obstacle_height: 2.5

    tof_left:
      topic: /tof_sensor_left/pointcloud
      data_type: PointCloud2
      marking: true
      clearing: false
      obstacle_range: 14.8
      raytrace_range: 15.0
      min_obstacle_height: -0.5
      max_obstacle_height: 2.0

    tof_right:
      topic: /tof_sensor_right/pointcloud
      data_type: PointCloud2
      marking: true
      clearing: false
      obstacle_range: 14.8
      raytrace_range: 15.0
      min_obstacle_height: -0.5
      max_obstacle_height: 2.0

  inflation_layer:
    enabled: false
